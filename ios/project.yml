# XcodeGen spec for Volta for iOS: `cd ios && xcodegen generate` writes Volta.xcodeproj.
#
#  Volta         the SwiftUI app
#  PacketTunnel  the Network Extension (NEPacketTunnelProvider) that runs Xray-core
#
# Shared/ (links, subscriptions, Xray configs) is compiled into both and is also the
# VoltaCore Swift package (Package.swift) the unit tests run against. Bridge/ wraps
# LibXray.xcframework, which CI builds with scripts/build-libxray.sh into Frameworks/.
name: Volta

options:
  bundleIdPrefix: com.ars3nb
  developmentLanguage: ru
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    CODE_SIGN_STYLE: Automatic
    # Identity of the build. CI overrides these from the provisioning profiles when it
    # signs; the unsigned build keeps them.
    VOLTA_BUNDLE_ID: com.ars3nb.volta
    VOLTA_EXT_BUNDLE_ID: com.ars3nb.volta.tunnel
    VOLTA_APP_GROUP: group.com.ars3nb.volta
    VOLTA_APP_PROFILE: ""
    VOLTA_EXT_PROFILE: ""

packages:
  # hev-socks5-tunnel, the same packet-to-SOCKS bridge the Android app uses.
  Tun2SocksKit:
    url: https://github.com/EbrahimTahernejad/Tun2SocksKit
    exactVersion: 5.16.0

targets:
  Volta:
    type: application
    platform: iOS
    sources:
      - path: Volta
      - path: Shared
      - path: Bridge
      - path: Localization
    dependencies:
      - target: PacketTunnel
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_NAME: Volta
        PRODUCT_BUNDLE_IDENTIFIER: $(VOLTA_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(VOLTA_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
    info:
      path: Config/Volta-Info.plist
      properties:
        CFBundleDisplayName: Volta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations: [ru, en, uk, kk, uz, tr, fa, zh-Hans, es, de]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts: [unbounded.ttf, onest.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: com.ars3nb.volta.links
            CFBundleURLSchemes: [volta]
        VoltaAppGroup: $(VOLTA_APP_GROUP)
        VoltaTunnelBundleID: $(VOLTA_EXT_BUNDLE_ID)
    entitlements:
      path: Config/Volta.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(VOLTA_APP_GROUP)]

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
      - path: Bridge
      - path: Localization
    dependencies:
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - package: Tun2SocksKit
        product: Tun2SocksKit
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(VOLTA_EXT_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(VOLTA_EXT_PROFILE)
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", "VOLTA_EXTENSION"]
    info:
      path: Config/PacketTunnel-Info.plist
      properties:
        CFBundleDisplayName: Volta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        VoltaAppGroup: $(VOLTA_APP_GROUP)
    entitlements:
      path: Config/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(VOLTA_APP_GROUP)]

schemes:
  Volta:
    build:
      targets:
        Volta: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
