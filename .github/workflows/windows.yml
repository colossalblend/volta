name: Windows app

on:
  push:
    branches: ['**']
    # A v… tag (v1.2.0) adds the Windows build to that tag's release, next to the APKs.
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
      # The Xray core the Android app ships: the Windows build follows its version.
      - 'app/libs/libv2ray.aar'
      # The Android app's texts, which the Windows screens show (see desktop/build.gradle.kts).
      - 'app/src/main/res/values*/strings*.xml'
      # The helpers for AmneziaWG, Hysteria v1 and OpenFlux, built here for Windows.
      - 'helper/voltaproxy/**'
      - 'openflux/**'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # Where this build goes, the same way as the APKs (android.yml): a v… tag goes to
      # the release of that tag, anything else to the branch's rolling pre-release
      # apk-<branch>. The installer only takes a numeric version, so a branch build is
      # 1.1.<run number>.
      - name: Release channel
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # The build number the in-app updater compares, counted like the APKs' versionCode.
          echo "VOLTA_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VOLTA_UPDATE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "VOLTA_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "VOLTA_STABLE=yes" >> "$GITHUB_ENV"
          else
            echo "VOLTA_UPDATE_TAG=apk-${BRANCH//\//-}" >> "$GITHUB_ENV"
            echo "VOLTA_STABLE=no" >> "$GITHUB_ENV"
          fi
          echo "VOLTA_TMP=$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          # The version Windows shows (Apps & Features, the installer): numbers only, as
          # desktop/build.gradle.kts makes it.
          RAW="${VOLTA_VERSION_NAME:-}"
          [ -n "$RAW" ] || RAW=$( [ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}" || echo "1.1.$GITHUB_RUN_NUMBER")
          NUM=$(python -c "import re,sys; p=[int(x) for x in re.findall(r'\d+', sys.argv[1].split('-')[0])][:3]; p+=[0]*(3-len(p)); print('%d.%d.%d' % (min(max(p[0],1),255), min(p[1],255), min(p[2],65535)))" "$RAW")
          echo "VOLTA_NUM=$NUM" >> "$GITHUB_ENV"
          echo "Windows version: $NUM"

      # Volta's own installer (desktop/installer, C#/WPF on .NET Framework 4.7.2, which every
      # Windows 10 1803+ has). Built here without the app first: that build is the
      # uninstaller, and it draws every installer page to PNG so the design can be looked
      # at (installer-*.png in the screens).
      - name: Installer program and its pages
        run: |
          set -euo pipefail
          dotnet --version
          dotnet build desktop/installer/VoltaSetup.csproj -c Release -nologo -v:minimal \
            -p:VoltaVersion="$VOLTA_NUM" -o "$VOLTA_TMP/uninstaller"
          ls -la "$VOLTA_TMP/uninstaller"
          SHOTS="$VOLTA_TMP/screens/installer"
          mkdir -p "$SHOTS"
          "$VOLTA_TMP/uninstaller/VoltaSetup.exe" --screenshots "$(cygpath -w "$SHOTS")" --log "$(cygpath -w "$VOLTA_TMP/installer-shots.log")" || true
          cat "$VOLTA_TMP/installer-shots.log" || true
          N=$(ls "$SHOTS"/*.png 2>/dev/null | wc -l)
          echo "installer pages drawn: $N"
          [ "$N" -ge 24 ] || { echo "::error title=Installer pages::only $N of 24 pages drawn"; exit 1; }
          # On a test build the pages go to the branch's pre-release right away (if it exists yet).
          if [ "$VOLTA_STABLE" != yes ] && gh release view "$VOLTA_UPDATE_TAG" > /dev/null 2>&1; then
            (cd "$SHOTS" && 7z a -tzip "$(cygpath -w "$VOLTA_TMP/windows-installer-pages.zip")" ./*.png > /dev/null)
            gh release upload "$VOLTA_UPDATE_TAG" "$VOLTA_TMP/windows-installer-pages.zip" --clobber || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # The very Xray release the Android app runs: its version is read from the core
      # committed in app/libs/libv2ray.aar (a Go pseudo-version names the commit), the
      # release tag on that commit is looked up, and the official Windows build of it is
      # downloaded and checked against the release's own SHA-256. geoip.dat and
      # geosite.dat come out of the same AAR, so both apps route with the same lists.
      - name: Xray version
        id: xver
        run: |
          set -euo pipefail
          W="$VOLTA_TMP/core"; mkdir -p "$W"
          python - <<'EOF' > "$W/aar-version"
          import re, zipfile
          with zipfile.ZipFile('app/libs/libv2ray.aar') as z:
              data = z.read('jni/arm64-v8a/libgojni.so')
          m = re.search(rb'dep\tgithub\.com/xtls/xray-core\t(v[^\t\n]+)', data)
          print(m.group(1).decode() if m else '')
          EOF
          AAR_VER=$(tr -d '\r\n' < "$W/aar-version")
          echo "Android core: ${AAR_VER:-unknown}"
          REFS=$(git ls-remote --tags https://github.com/XTLS/Xray-core \
            || { sleep 20; git ls-remote --tags https://github.com/XTLS/Xray-core; })
          HASH=""
          if [[ "$AAR_VER" =~ -([0-9a-f]{12})$ ]]; then
            HASH="${BASH_REMATCH[1]}"
          elif [ -n "$AAR_VER" ]; then
            HASH=$(awk -v t="refs/tags/$AAR_VER" '$2==t || $2==t"^{}" {print substr($1,1,12)}' <<<"$REFS" | tail -1)
          fi
          TAG=""
          if [ -n "$HASH" ]; then
            TAG=$(awk -v h="$HASH" 'substr($1,1,12)==h {sub("refs/tags/","",$2); sub("\\^\\{\\}","",$2); print $2}' <<<"$REFS" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v '^v1\.' | head -1 || true)
          fi
          if [ -z "$TAG" ]; then
            TAG=$(tr -d '[:space:]' < desktop/xray.version)
            echo "::warning title=Xray version::no release tag on the Android core ($AAR_VER); using $TAG from desktop/xray.version"
          fi
          echo "Windows core: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The release archive is kept between runs: GitHub's download links answer 504 now
      # and then, and a build shouldn't fail on that.
      - name: Restore Xray archive
        id: xcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xray-dl
          key: xray-windows-${{ steps.xver.outputs.tag }}

      - name: Xray core
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xver.outputs.tag }}
        run: |
          set -euo pipefail
          W="$VOLTA_TMP/core"; mkdir -p "$W"
          D="$VOLTA_TMP/xray-dl"; mkdir -p "$D"
          OUT=desktop/resources/windows-x64
          mkdir -p "$OUT"
          sha_ok() {
            [ -s "$D/xray.zip" ] && [ -s "$D/xray.zip.dgst" ] || return 1
            WANT=$(grep -i 'SHA2-256' "$D/xray.zip.dgst" | head -1 | awk -F'= *' '{print tolower($2)}' | tr -d '\r ')
            GOT=$(sha256sum "$D/xray.zip" | cut -d ' ' -f 1)
            [ -n "$WANT" ] && [ "$WANT" = "$GOT" ]
          }
          if sha_ok; then
            echo "Xray $TAG from the cache"
          else
            BASE="https://github.com/XTLS/Xray-core/releases/download/$TAG"
            # GitHub's download links sometimes answer 504 for a while: then the same files
            # through the API (checked against the same SHA-256 below either way).
            for f in Xray-windows-64.zip Xray-windows-64.zip.dgst; do
              out="$D/${f/Xray-windows-64/xray}"
              curl -fsSL --retry 4 --retry-delay 10 --retry-all-errors -o "$out" "$BASE/$f" \
                || gh release download "$TAG" -R XTLS/Xray-core -p "$f" -O "$out" --clobber \
                || { sleep 30; gh release download "$TAG" -R XTLS/Xray-core -p "$f" -O "$out" --clobber; }
            done
            if ! sha_ok; then
              echo "::error title=Xray download::SHA-256 mismatch (want '${WANT:-}', got '${GOT:-}')"
              rm -f "$D/xray.zip" "$D/xray.zip.dgst"
              exit 1
            fi
          fi
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$D/xray.zip" "$W/xray"
          ls -la "$W/xray"
          cp "$W/xray/xray.exe" "$OUT/xray.exe"
          cp "$W/xray/LICENSE" "$OUT/xray-LICENSE.txt" 2>/dev/null || true
          python - "$OUT" <<'EOF' || { echo "::warning title=Geo lists::not in the AAR, using the release's"; cp "$W/xray/geoip.dat" "$W/xray/geosite.dat" "$OUT/"; }
          import sys, zipfile
          out = sys.argv[1]
          with zipfile.ZipFile('app/libs/libv2ray.aar') as z:
              for name in ('geoip.dat', 'geosite.dat'):
                  open(f'{out}/{name}', 'wb').write(z.read(f'assets/{name}'))
          EOF
          ls -la "$OUT"
          "$OUT/xray.exe" version | head -1
          echo "xray=$TAG" >> "$GITHUB_OUTPUT"

      - name: Save Xray archive
        if: steps.xcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xray-dl
          key: xray-windows-${{ steps.xver.outputs.tag }}

      # The Android app's helpers, built for Windows and shipped next to xray.exe, run the
      # same way as on the phone (core/helper/ProxyHelper.kt, core/openflux/OpenFluxRunner.kt):
      # voltaproxy (helper/voltaproxy: AmneziaWG 1.x–3.x, Hysteria v1, Hysteria2 with obfs)
      # after its own tests, and OpenFlux at openflux/VERSION with openflux/voltaflux, as the
      # step «OpenFlux helper» in android.yml does for Android.
      - name: Helpers (voltaproxy, OpenFlux)
        id: helpers
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=auto
          OUT=$(cygpath -m "$GITHUB_WORKSPACE/desktop/resources/windows-x64")
          mkdir -p "$OUT"
          (cd helper/voltaproxy && go vet ./... && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o "$OUT/voltaproxy.exe" .)
          COMMIT=$(tr -d '[:space:]' < openflux/VERSION)
          SRC="$VOLTA_TMP/openflux"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/p1neappleXpress/OpenFlux
          git -C "$SRC" fetch -q --depth 1 origin "$COMMIT"
          git -C "$SRC" checkout -q FETCH_HEAD
          mkdir -p "$SRC/mobile/cmd/voltaflux"
          cp openflux/voltaflux/main.go "$SRC/mobile/cmd/voltaflux/"
          cp "$SRC/LICENSE" "$OUT/openflux-LICENSE.txt" 2>/dev/null || true
          (cd "$SRC/mobile" && {
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -checklinkname=0" \
              -o "$OUT/openflux.exe" ./cmd/voltaflux \
            || { echo "::warning title=OpenFlux::retrying with cgo"; CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w -checklinkname=0" -o "$OUT/openflux.exe" ./cmd/voltaflux; }
          })
          # Both answer a broken request with an error event (what Volta reads).
          echo '{"kind":"awg","config":"broken","listen":"127.0.0.1:0"}' | "$OUT/voltaproxy.exe" | head -1 | tee "$VOLTA_TMP/vp.txt" || true
          grep -q '"event":"error"' "$VOLTA_TMP/vp.txt"
          echo '{"link":"openflux://v1/broken","listen":"127.0.0.1:0"}' | "$OUT/openflux.exe" 2>/dev/null | head -1 | tee "$VOLTA_TMP/of.txt" || true
          grep -q '"event":"error"' "$VOLTA_TMP/of.txt"
          ls -la "$OUT"
          echo "openflux=$COMMIT" >> "$GITHUB_OUTPUT"

      # jpackage needs the WiX Toolset for the MSI the app build makes. The Compose plugin
      # would download it from GitHub on every run (and fail the build on a 504); here it
      # is fetched once with the same fallbacks as the Xray core, checked, kept between
      # runs and handed over through WIX_PATH before Gradle first starts (so its daemon
      # has it): the plugin then downloads nothing.
      - name: Restore WiX Toolset
        id: wixcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wix
          key: wix3112rtm-binaries

      - name: WiX Toolset
        env:
          GH_TOKEN: ${{ github.token }}
          # wix311-binaries.zip of the wix3112rtm release (WiX 3.11.2).
          WIX_SHA256: 2c1888d5d1dba377fc7fa14444cf556963747ff9a0a289a3599cf09da03b9e2e
        run: |
          set -euo pipefail
          WIX="$VOLTA_TMP/wix"
          if [ ! -f "$WIX/candle.exe" ] || [ ! -f "$WIX/light.exe" ]; then
            rm -rf "$WIX"; mkdir -p "$WIX"
            ZIP="$VOLTA_TMP/wix311-binaries.zip"
            curl -fsSL --retry 4 --retry-delay 10 --retry-all-errors -o "$ZIP" \
                https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip \
              || gh release download wix3112rtm -R wixtoolset/wix3 -p wix311-binaries.zip -O "$ZIP" --clobber \
              || { sleep 30; gh release download wix3112rtm -R wixtoolset/wix3 -p wix311-binaries.zip -O "$ZIP" --clobber; }
            GOT=$(sha256sum "$ZIP" | cut -d ' ' -f 1)
            if [ "$GOT" != "$WIX_SHA256" ]; then
              echo "::error title=WiX download::SHA-256 mismatch (want '$WIX_SHA256', got '$GOT')"
              exit 1
            fi
            python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$ZIP" "$WIX"
          else
            echo "WiX from the cache"
          fi
          ls "$WIX" | head -5
          echo "WIX_PATH=$(cygpath -w "$WIX")" >> "$GITHUB_ENV"

      - name: Save WiX Toolset
        if: steps.wixcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wix
          key: wix3112rtm-binaries

      # Unit tests also write every kind of config Volta builds; the core about to be
      # shipped must accept each one, or the build stops here.
      - name: Unit tests and config check
        working-directory: desktop
        run: |
          set -o pipefail
          export VOLTA_CONFIG_DUMP="$VOLTA_TMP/configs"
          ./gradlew --no-configuration-cache --stacktrace test 2>&1 | tee "$VOLTA_TMP/gradle.log"
          XRAY_LOCATION_ASSET=resources/windows-x64
          export XRAY_LOCATION_ASSET
          bad=0
          for f in "$VOLTA_CONFIG_DUMP"/*.json; do
            [ -e "$f" ] || continue
            out=$(resources/windows-x64/xray.exe run -test -c "$f" 2>&1) || true
            if grep -q "Configuration OK" <<<"$out"; then
              echo "ok   $(basename "$f")"
            else
              echo "FAIL $(basename "$f"): $(tail -n 2 <<<"$out")"
              echo "::error title=Xray refuses $(basename "$f")::$(tail -n 1 <<<"$out")"
              bad=1
            fi
          done
          exit $bad

      # The app folder (Volta.exe with its Java runtime, xray.exe and the helpers). The
      # jpackage MSI of earlier builds is made too, only so the test below can check that
      # an existing install moves over to the new installer with the user's data intact.
      - name: Build the app
        working-directory: desktop
        env:
          VOLTA_MSI: "1"
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache --stacktrace createDistributable packageMsi 2>&1 | tee -a "$VOLTA_TMP/gradle.log"
          ls -la build/compose/binaries/main/app/Volta build/compose/binaries/main/msi

      # The portable zip is the app folder as it is. The installer carries the same folder
      # plus «Uninstall Volta.exe» (the build above) as payload.zip, and its version.
      - name: Installer
        run: |
          set -euo pipefail
          APP=desktop/build/compose/binaries/main/app/Volta
          W="$VOLTA_TMP/package"; mkdir -p "$W"
          (cd "$(dirname "$APP")" && 7z a -tzip -mx=7 "$(cygpath -w "$W/portable.zip")" Volta > /dev/null)
          cp -r "$APP" "$W/payload"
          cp "$VOLTA_TMP/uninstaller/VoltaSetup.exe" "$W/payload/Uninstall Volta.exe"
          (cd "$W/payload" && 7z a -tzip -mx=9 -mm=Deflate "$(cygpath -w "$W/payload.zip")" . > /dev/null)
          SIZE=$(du -sb "$W/payload" | cut -f 1)
          FILES=$(find "$W/payload" -type f | wc -l)
          jq -n --arg version "$VOLTA_NUM" --argjson code "$VOLTA_VERSION_CODE" --argjson size "$SIZE" --argjson files "$FILES" \
            '{version: $version, versionCode: $code, size: $size, files: $files}' > "$W/payload.json"
          cat "$W/payload.json"
          dotnet build desktop/installer/VoltaSetup.csproj -c Release -nologo -v:minimal \
            -p:VoltaVersion="$VOLTA_NUM" -p:VoltaPayload="$(cygpath -w "$W/payload.zip")" -p:VoltaPayloadInfo="$(cygpath -w "$W/payload.json")" \
            -o "$W/setup"
          ls -la "$W" "$W/setup"
          cp desktop/build/compose/binaries/main/msi/*.msi "$W/legacy.msi"

      # The installer, the installed app and the uninstaller, end to end, under a user name
      # with Cyrillic letters and spaces (desktop/installer/ci/installer-test.ps1): install,
      # the app's self-test from there, its window, a second start, a hung instance, an
      # update over a running Volta, uninstall with and without the data, and the move from
      # the old MSI install.
      - name: Install, run, update and uninstall
        shell: pwsh
        run: |
          $w = Join-Path $env:RUNNER_TEMP "package"
          ./desktop/installer/ci/installer-test.ps1 -Setup (Join-Path $w "setup\VoltaSetup.exe") `
            -Shots (Join-Path $env:RUNNER_TEMP "screens") -Work (Join-Path $env:RUNNER_TEMP "itest") `
            -LegacyMsi (Join-Path $w "legacy.msi")

      # The pictures of the real windows (installer, app, the «не отвечает» dialog) and the
      # logs, to the branch's pre-release even when a check above failed.
      - name: Installer pictures to the pre-release
        if: always() && env.VOLTA_STABLE != 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$VOLTA_TMP"
          [ -d screens ] || exit 0
          cp itest/*.log screens/ 2>/dev/null || true
          7z a -tzip windows-installer-screens.zip screens/installer screens/real-*.png screens/*.log > /dev/null || true
          ls -la windows-installer-screens.zip || exit 0
          gh release view "$VOLTA_UPDATE_TAG" > /dev/null 2>&1 && gh release upload "$VOLTA_UPDATE_TAG" windows-installer-screens.zip --clobber || true

      - name: Collect files
        id: files
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          XRAY: ${{ steps.core.outputs.xray }}
          OPENFLUX: ${{ steps.helpers.outputs.openflux }}
        run: |
          set -euo pipefail
          SHORT="${SHA::7}"
          VERSION="${VOLTA_VERSION_NAME:-1.1.$GITHUB_RUN_NUMBER}"
          STEM=$([ "$VOLTA_STABLE" = yes ] && echo "volta-$VERSION" || echo "volta-$SHORT")
          OUT="$VOLTA_TMP/out"; mkdir -p "$OUT"
          cp "$VOLTA_TMP/package/setup/VoltaSetup.exe" "$OUT/$STEM-windows-x64-setup.exe"
          cp "$VOLTA_TMP/package/portable.zip" "$OUT/$STEM-windows-x64-portable.zip"
          # What the in-app updater reads (desktop/…/update/AppUpdater.kt), as update.json is
          # for the APKs: this build's number and the installer with its size, SHA-256 and
          # how to run it unattended (it closes Volta, keeps %APPDATA%\Volta, starts it again).
          SETUP="$STEM-windows-x64-setup.exe"
          PORTABLE="$STEM-windows-x64-portable.zip"
          jq -n --argjson code "$VOLTA_VERSION_CODE" --arg name "$VERSION" --arg tag "$VOLTA_UPDATE_TAG" \
            --arg commit "$SHA" --arg branch "${BRANCH:-}" --arg xray "${XRAY:-}" --arg openflux "${OPENFLUX:-}" \
            --arg setup "$SETUP" --argjson setupSize "$(stat -c %s "$OUT/$SETUP")" --arg setupSha "$(sha256sum "$OUT/$SETUP" | cut -d ' ' -f 1)" \
            --arg portable "$PORTABLE" --argjson portableSize "$(stat -c %s "$OUT/$PORTABLE")" --arg portableSha "$(sha256sum "$OUT/$PORTABLE" | cut -d ' ' -f 1)" \
            '{versionCode: $code, versionName: $name, tag: $tag, commit: $commit, branch: $branch, xray: $xray, openflux: $openflux,
              installer: {name: $setup, size: $setupSize, sha256: $setupSha, silent: ["--silent", "--update", "--launch"]},
              portable: {name: $portable, size: $portableSize, sha256: $portableSha}}' > "$OUT/windows-update.json"
          cat "$OUT/windows-update.json"
          ls -la "$OUT"
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$(cygpath -w "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Upload the app as an artifact
        uses: actions/upload-artifact@v5
        with:
          name: volta-windows
          path: ${{ steps.files.outputs.dir }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload screens
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: volta-windows-screens
          path: |
            ${{ runner.temp }}/screens
            ${{ runner.temp }}/itest/*.log
            ${{ runner.temp }}/installer-shots.log
          retention-days: 14
          if-no-files-found: ignore

      # Same releases as the APKs. A v… tag: that tag's release (made here if the Android
      # build hasn't made it yet). A branch: its rolling pre-release apk-<branch>, made as
      # a pre-release when it doesn't exist. Only the Windows files are touched: older
      # Windows builds of the branch are replaced, update.json and the APKs never.
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.sha }}
          XRAY: ${{ steps.core.outputs.xray }}
          OPENFLUX: ${{ steps.helpers.outputs.openflux }}
          STEM: ${{ steps.files.outputs.stem }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$VOLTA_UPDATE_TAG"
          SHORT="${SHA::7}"
          OUT="$VOLTA_TMP/out"
          NOTES="$VOLTA_TMP/notes.md"
          cat > "$NOTES" <<EOF_NOTES
          Volta $VERSION.

          Windows:
          - **\`$STEM-windows-x64-setup.exe\`** — установщик для Windows 10 и 11 (64 бит), ставьте этот.
            Права администратора не нужны; Volta ставится в %LOCALAPPDATA%\\Programs\\Volta.
            Обновляет прежнюю установку на месте, подписки и настройки (%APPDATA%\\Volta) не трогает.
            Удаление — «Параметры → Приложения» или «Uninstall Volta.exe»: данные удаляются,
            только если отметить «Удалить также подписки и настройки».
          - \`$STEM-windows-x64-portable.zip\` — без установки: распакуйте и запустите Volta.exe.

          Обновляется само: Настройки → О приложении (файл windows-update.json рядом).

          Сборка из коммита $SHA. Ядро: Xray \`${XRAY:-—}\`. OpenFlux: \`${OPENFLUX:-—}\` (GPL-3.0).
          EOF_NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' | tr -d '\r')
            # Earlier Windows builds of this branch go; nothing else does.
            OLD=$(grep -E -- '-windows-x64(-setup\.exe|-portable\.zip)$' <<<"$ASSETS" \
              | grep -v -F -x -e "$STEM-windows-x64-setup.exe" -e "$STEM-windows-x64-portable.zip" || true)
            for old in $OLD; do gh release delete-asset "$TAG" "$old" --yes || true; done
            gh release upload "$TAG" "$OUT"/* --clobber
            # A release only the Windows build fills is named after the latest build; one
            # the Android build made keeps its own title and notes.
            if [ "$VOLTA_STABLE" != yes ] && ! grep -q -E '\.(apk|aab)$|^update\.json$' <<<"$ASSETS"; then
              gh release edit "$TAG" --title "Volta · $BRANCH · $SHORT (тестовая)" --notes-file "$NOTES" || true
            fi
          elif [ "$VOLTA_STABLE" = yes ]; then
            gh release create "$TAG" "$OUT"/* --verify-tag --title "Volta $VERSION" --notes-file "$NOTES" \
              || gh release upload "$TAG" "$OUT"/* --clobber
          else
            gh release create "$TAG" "$OUT"/* --target "$SHA" --prerelease \
              --title "Volta · $BRANCH · $SHORT (тестовая)" --notes-file "$NOTES" \
              || gh release upload "$TAG" "$OUT"/* --clobber
          fi
          # The self-test's pictures of every screen ride along on test builds, so a design
          # change can be looked at before anyone installs it.
          if [ "$VOLTA_STABLE" != yes ] && [ -d "$VOLTA_TMP/screens" ]; then
            (cd "$VOLTA_TMP" && 7z a -tzip windows-screens.zip screens > /dev/null) \
              && gh release upload "$TAG" "$VOLTA_TMP/windows-screens.zip" --clobber || true
            (cd "$VOLTA_TMP/screens" && 7z a -tzip ../windows-installer-screens.zip installer real-*.png > /dev/null) \
              && gh release upload "$TAG" "$VOLTA_TMP/windows-installer-screens.zip" --clobber || true
          fi
          echo "### Windows: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json assets --jq '.assets[].name'

      - name: Report build errors
        if: failure()
        run: |
          LOG="$VOLTA_TMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          ERRS=$(grep -E '^e: |error:|What went wrong|FAILED|Exception|> ' "$LOG" | grep -v '^\s*at ' | head -120)
          ERRS="${ERRS//'%'/'%25'}"
          ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Gradle build failed::${ERRS}"

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: windows-test-reports
          path: desktop/build/reports/
          retention-days: 7
          if-no-files-found: ignore
