name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" || sdkmanager "platforms;android-37.0" "build-tools;36.0.0" || true

      - uses: gradle/actions/setup-gradle@v4

      # Optional real release key: add VOLTA_KEYSTORE_BASE64, VOLTA_KEYSTORE_PASSWORD,
      # VOLTA_KEY_ALIAS and VOLTA_KEY_PASSWORD as repository secrets. Without them the
      # release APK is signed with the CI debug key so it still installs and updates.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VOLTA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "VOLTA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest

      - name: Build APKs
        env:
          VOLTA_KEYSTORE_PASSWORD: ${{ secrets.VOLTA_KEYSTORE_PASSWORD }}
          VOLTA_KEY_ALIAS: ${{ secrets.VOLTA_KEY_ALIAS }}
          VOLTA_KEY_PASSWORD: ${{ secrets.VOLTA_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: volta-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: volta-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore
