name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK; install it ourselves only if missing.
      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;36.0.0" > /dev/null
          "$SDKM" "platforms;android-37" > /dev/null || "$SDKM" "platforms;android-37.0" > /dev/null || true
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v5

      # The rolling pre-release this build goes to. Baked into the APK as the channel
      # its in-app updater follows (together with apk-main).
      - name: Release channel
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "VOLTA_UPDATE_TAG=apk-${BRANCH//\//-}" >> "$GITHUB_ENV"

      # Optional real release key: add VOLTA_KEYSTORE_BASE64, VOLTA_KEYSTORE_PASSWORD,
      # VOLTA_KEY_ALIAS and VOLTA_KEY_PASSWORD as repository secrets. Without them the
      # release APK is signed with the CI debug key so it still installs and updates.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VOLTA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "VOLTA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        env:
          VOLTA_CONFIG_DUMP: ${{ runner.temp }}/configs
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # The Xray core. The newest libv2ray.aar from 2dust/AndroidLibXrayLite replaces the
      # committed one only when it is newer, still has every call Volta makes, and a
      # desktop Xray of the very same version accepts every config Volta builds (the
      # unit tests above wrote them out). The shipped core is checked the same way, so a
      # config the core would refuse fails the build here instead of on the phone.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Xray core
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGS: ${{ runner.temp }}/configs
        run: |
          set -uo pipefail
          export GOTOOLCHAIN=auto CGO_ENABLED=0
          W="$RUNNER_TEMP/core"; mkdir -p "$W"
          AAR=app/libs/libv2ray.aar

          xray_of() {
            unzip -p "$1" jni/arm64-v8a/libgojni.so | strings \
              | awk '$1=="dep" && $2=="github.com/xtls/xray-core" {print $3; exit}'
          }
          # v1.YYMMDD.N tags and v1.x-0.YYYYMMDDhhmmss-hash commits as one sortable number.
          key_of() {
            if [[ "$1" =~ -0\.([0-9]{14})- ]]; then echo "${BASH_REMATCH[1]}"
            elif [[ "$1" =~ ^v1\.([0-9]{6})\.([0-9]+)$ ]]; then echo "20${BASH_REMATCH[1]}$(printf '%06d' "${BASH_REMATCH[2]}")"
            else echo 0; fi
          }
          api_ok() {
            unzip -o -q "$1" classes.jar -d "$W/api" || return 1
            local sig; sig=$(javap -classpath "$W/api/classes.jar" libv2ray.Libv2ray libv2ray.CoreController libv2ray.CoreCallbackHandler) || return 1
            for need in \
              'java.lang.String checkVersionX()' \
              'void initCoreEnv(java.lang.String, java.lang.String)' \
              'long measureOutboundDelay(java.lang.String, java.lang.String)' \
              'java.lang.String fetchTlsCertSha256(java.lang.String)' \
              'java.lang.String fetchQuicCertSha256(java.lang.String)' \
              'libv2ray.CoreController newCoreController(libv2ray.CoreCallbackHandler)' \
              'boolean getIsRunning()' \
              'java.lang.String queryAllOutboundTrafficStats()' \
              'void startLoop(java.lang.String, int)' \
              'void stopLoop()' \
              'long onEmitStatus(long, java.lang.String)' \
              'long shutdown()' \
              'long startup()'; do
              grep -qF "$need" <<<"$sig" || { echo "missing: $need"; return 1; }
            done
            for f in jni/arm64-v8a/libgojni.so jni/armeabi-v7a/libgojni.so jni/x86_64/libgojni.so assets/geoip.dat assets/geosite.dat; do
              unzip -l "$1" "$f" > /dev/null || { echo "missing: $f"; return 1; }
            done
          }
          # 0 = every config accepted, 1 = some refused, 2 = could not check.
          configs_ok() {
            local ver; ver=$(xray_of "$1")
            local bin="$W/xray-$ver" geo="$W/geo-$ver" bad=0 out f
            if [ ! -x "$bin" ]; then
              GOBIN="$W/bin-$ver" go install "github.com/xtls/xray-core/main@$ver" || return 2
              mv "$W/bin-$ver/main" "$bin"
            fi
            mkdir -p "$geo"
            unzip -o -q -j "$1" assets/geoip.dat assets/geosite.dat -d "$geo" || return 2
            ls "$CONFIGS"/*.json > /dev/null 2>&1 || return 2
            for f in "$CONFIGS"/*.json; do
              out=$(XRAY_LOCATION_ASSET="$geo" "$bin" run -test -c "$f" 2>&1)
              if ! grep -q "Configuration OK" <<<"$out"; then
                echo "::warning title=Xray $ver refuses $(basename "$f")::$(tail -n 1 <<<"$out")"
                bad=1
              fi
            done
            return $bad
          }

          CUR=$(xray_of "$AAR")
          echo "Committed core: $CUR"
          adopted=no
          if gh release download --repo 2dust/AndroidLibXrayLite --pattern libv2ray.aar --dir "$W" --clobber \
            || curl -fsSL -o "$W/libv2ray.aar" https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar; then
            NEW=$(xray_of "$W/libv2ray.aar")
            echo "Newest release: $NEW"
            if [ "$(key_of "$NEW")" -le "$(key_of "$CUR")" ]; then
              echo "The committed core is already the newest."
            elif ! api_ok "$W/libv2ray.aar"; then
              echo "::warning title=Xray core kept::$NEW changed the library interface; staying on $CUR"
            else
              configs_ok "$W/libv2ray.aar"; rc=$?
              if [ $rc = 0 ]; then
                cp "$W/libv2ray.aar" "$AAR"
                adopted=yes
                echo "::notice title=Xray core updated::$CUR -> $NEW"
              else
                echo "::warning title=Xray core kept::$NEW could not be verified with Volta's configs (code $rc); staying on $CUR"
              fi
            fi
          else
            echo "::warning title=Xray core kept::could not download the newest core; staying on $CUR"
          fi

          if [ $adopted = no ]; then
            configs_ok "$AAR"; rc=$?
            if [ $rc = 1 ]; then
              echo "::error title=Configs refused::the shipped core $CUR refuses configs Volta builds (see warnings)"
              exit 1
            elif [ $rc = 2 ]; then
              echo "::warning title=Configs not checked::could not build Xray $CUR to check the configs"
            fi
          fi
          echo "xray=$(xray_of "$AAR")" >> "$GITHUB_OUTPUT"
          echo "adopted=$adopted" >> "$GITHUB_OUTPUT"

      - name: APKs
        env:
          VOLTA_KEYSTORE_PASSWORD: ${{ secrets.VOLTA_KEYSTORE_PASSWORD }}
          VOLTA_KEY_ALIAS: ${{ secrets.VOLTA_KEY_ALIAS }}
          VOLTA_KEY_PASSWORD: ${{ secrets.VOLTA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            :app:assembleDebug :app:assembleRelease 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # Compiler and Gradle errors as one annotation, readable without the raw log.
      - name: Report build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          ERRS=$(grep -E '^e: |error:|What went wrong|FAILED|Exception|> ' "$LOG" | grep -v '^\s*at ' | head -120)
          ERRS="${ERRS//'%'/'%25'}"
          ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Gradle build failed::${ERRS}"

      # Releases are not counted against the Actions artifact storage quota, which
      # is shared by all of the owner's private repositories and fills up easily.
      # One rolling pre-release per branch: always the latest build, never a pile.
      - name: Publish APKs to a pre-release
        id: release
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          XRAY: ${{ steps.core.outputs.xray }}
          XRAY_UPDATED: ${{ steps.core.outputs.adopted }}
        run: |
          TAG="$VOLTA_UPDATE_TAG"
          SHORT="${SHA::7}"
          VERSION="1.1.$GITHUB_RUN_NUMBER"
          OUT="$RUNNER_TEMP/apk"
          mkdir -p "$OUT"
          # app-<abi>-release.apk → volta-<sha>-<abi>.apk
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk); abi=${abi#app-}; abi=${abi%-release}
            cp "$f" "$OUT/volta-$SHORT-$abi.apk"
          done
          cp app/build/outputs/apk/debug/*arm64-v8a*.apk "$OUT/volta-$SHORT-arm64-v8a-debug.apk"
          # What the in-app updater reads: this build's number and the APK for each CPU.
          APKS='[]'
          for f in "$OUT"/*.apk; do
            name=$(basename "$f"); abi=${name#volta-$SHORT-}; abi=${abi%.apk}
            APKS=$(jq -c --arg abi "$abi" --arg name "$name" --argjson size "$(stat -c %s "$f")" \
              --arg sha "$(sha256sum "$f" | cut -d ' ' -f 1)" \
              '. + [{abi: $abi, name: $name, size: $size, sha256: $sha}]' <<<"$APKS")
          done
          jq -n --argjson code "$((100 + GITHUB_RUN_NUMBER))" --arg name "$VERSION" --arg commit "$SHA" \
            --arg branch "$BRANCH" --arg xray "${XRAY:-}" --argjson apks "$APKS" \
            '{versionCode: $code, versionName: $name, commit: $commit, branch: $branch, xray: $xray, apks: $apks}' \
            > "$OUT/update.json"
          ls -la "$OUT"
          cat "$OUT/update.json"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "$OUT"/*.apk "$OUT/update.json" \
            --target "$SHA" --prerelease \
            --title "Volta $VERSION · $BRANCH · $SHORT" \
            --notes "Сборка GitHub Actions: ветка \`$BRANCH\`, коммит $SHA.
          Ядро Xray: \`${XRAY:-—}\`$([ "$XRAY_UPDATED" = yes ] && echo ' (обновлено при сборке)').

          - **\`volta-$SHORT-arm64-v8a.apk\`** — для почти всех телефонов, ставьте этот.
          - \`volta-$SHORT-armeabi-v7a.apk\` — для старых 32-битных телефонов.
          - \`volta-$SHORT-universal.apk\` — подходит всем, но весит ~150 МБ.
          - \`volta-$SHORT-x86_64.apk\` — для эмулятора.
          - \`volta-$SHORT-arm64-v8a-debug.apk\` — отладочная, если нужно снять логи.

          Все подписаны одним ключом, так что новая сборка ставится поверх старой.
          Версия $VERSION. Установленное приложение найдёт её само: Настройки → Обновления."
          echo "url=https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
          echo "### APK: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # The repository is private, so a phone can't download from it without a key. With
      # a VOLTA_RELEASES_TOKEN secret (a token allowed to write to <owner>/volta-releases,
      # a public repository with at least one commit) every build is copied there too,
      # under the same tag, and the app updates from it with no key at all.
      - name: Copy APKs to the public releases repository
        if: steps.release.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.VOLTA_RELEASES_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No VOLTA_RELEASES_TOKEN secret: builds stay in this repository only."
            exit 0
          fi
          MIRROR="$GITHUB_REPOSITORY_OWNER/volta-releases"
          VERSION="1.1.$GITHUB_RUN_NUMBER"
          OUT="$RUNNER_TEMP/apk"
          gh release delete "$VOLTA_UPDATE_TAG" --repo "$MIRROR" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$VOLTA_UPDATE_TAG" "$OUT"/*.apk "$OUT/update.json" \
            --repo "$MIRROR" --prerelease \
            --title "Volta $VERSION · ${SHA::7}" \
            --notes "Volta $VERSION. **\`volta-${SHA::7}-arm64-v8a.apk\`** подходит почти всем телефонам."
          echo "### Public copy: https://github.com/$MIRROR/releases/tag/$VOLTA_UPDATE_TAG" >> "$GITHUB_STEP_SUMMARY"

      # Fallback when the release could not be made (e.g. a fork PR without write access).
      - name: Upload APKs as an artifact
        if: steps.release.outcome != 'success'
        uses: actions/upload-artifact@v5
        with:
          name: volta-apk
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
