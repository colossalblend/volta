name: Android APK

on:
  push:
    branches: [main]
    # A v… tag (v1.2.0) makes a published release: what installed apps update to.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      shots:
        description: Only draw the main screens in English and German (no APKs); the pictures come as the "screens" artifact
        type: boolean
        default: false

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}${{ inputs.shots && '-shots' || '' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.shots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK; install it ourselves only if missing.
      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;36.0.0" > /dev/null
          "$SDKM" "platforms;android-37" > /dev/null || "$SDKM" "platforms;android-37.0" > /dev/null || true
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v5

      # Where this build goes. A v… tag: a published release named after the tag, which
      # installed apps update to. Anything else: the branch's rolling pre-release for
      # testing (apps never update to those on their own).
      - name: Release channel
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VOLTA_UPDATE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "VOLTA_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "VOLTA_STABLE=yes" >> "$GITHUB_ENV"
          else
            echo "VOLTA_UPDATE_TAG=apk-${BRANCH//\//-}" >> "$GITHUB_ENV"
            echo "VOLTA_STABLE=no" >> "$GITHUB_ENV"
          fi

      # Optional real release key: add VOLTA_KEYSTORE_BASE64, VOLTA_KEYSTORE_PASSWORD,
      # VOLTA_KEY_ALIAS and VOLTA_KEY_PASSWORD as repository secrets. Without them the
      # release APK is signed with the CI debug key so it still installs and updates.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VOLTA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "VOLTA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        env:
          VOLTA_CONFIG_DUMP: ${{ runner.temp }}/configs
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            :app:testGithubDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # The Xray core. The newest libv2ray.aar from 2dust/AndroidLibXrayLite replaces the
      # committed one only when it is newer, still has every call Volta makes, and a
      # desktop Xray of the very same version accepts every config Volta builds (the
      # unit tests above wrote them out). The shipped core is checked the same way, so a
      # config the core would refuse fails the build here instead of on the phone.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Xray core
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGS: ${{ runner.temp }}/configs
        run: |
          set -uo pipefail
          export GOTOOLCHAIN=auto CGO_ENABLED=0
          W="$RUNNER_TEMP/core"; mkdir -p "$W"
          AAR=app/libs/libv2ray.aar

          xray_of() {
            unzip -p "$1" jni/arm64-v8a/libgojni.so | strings \
              | awk '$1=="dep" && $2=="github.com/xtls/xray-core" {print $3; exit}'
          }
          # v1.YYMMDD.N tags and v1.x-0.YYYYMMDDhhmmss-hash commits as one sortable number.
          key_of() {
            if [[ "$1" =~ -0\.([0-9]{14})- ]]; then echo "${BASH_REMATCH[1]}"
            elif [[ "$1" =~ ^v1\.([0-9]{6})\.([0-9]+)$ ]]; then echo "20${BASH_REMATCH[1]}$(printf '%06d' "${BASH_REMATCH[2]}")"
            else echo 0; fi
          }
          api_ok() {
            unzip -o -q "$1" classes.jar -d "$W/api" || return 1
            local sig; sig=$(javap -classpath "$W/api/classes.jar" libv2ray.Libv2ray libv2ray.CoreController libv2ray.CoreCallbackHandler) || return 1
            for need in \
              'java.lang.String checkVersionX()' \
              'void initCoreEnv(java.lang.String, java.lang.String)' \
              'long measureOutboundDelay(java.lang.String, java.lang.String)' \
              'java.lang.String fetchTlsCertSha256(java.lang.String)' \
              'java.lang.String fetchQuicCertSha256(java.lang.String)' \
              'libv2ray.CoreController newCoreController(libv2ray.CoreCallbackHandler)' \
              'boolean getIsRunning()' \
              'java.lang.String queryAllOutboundTrafficStats()' \
              'void startLoop(java.lang.String, int)' \
              'void stopLoop()' \
              'long onEmitStatus(long, java.lang.String)' \
              'long shutdown()' \
              'long startup()'; do
              grep -qF "$need" <<<"$sig" || { echo "missing: $need"; return 1; }
            done
            for f in jni/arm64-v8a/libgojni.so jni/armeabi-v7a/libgojni.so jni/x86_64/libgojni.so assets/geoip.dat assets/geosite.dat; do
              unzip -l "$1" "$f" > /dev/null || { echo "missing: $f"; return 1; }
            done
          }
          # 0 = every config accepted, 1 = some refused, 2 = could not check.
          configs_ok() {
            local ver; ver=$(xray_of "$1")
            local bin="$W/xray-$ver" geo="$W/geo-$ver" bad=0 out f
            if [ ! -x "$bin" ]; then
              GOBIN="$W/bin-$ver" go install "github.com/xtls/xray-core/main@$ver" || return 2
              mv "$W/bin-$ver/main" "$bin"
            fi
            mkdir -p "$geo"
            unzip -o -q -j "$1" assets/geoip.dat assets/geosite.dat -d "$geo" || return 2
            ls "$CONFIGS"/*.json > /dev/null 2>&1 || return 2
            for f in "$CONFIGS"/*.json; do
              out=$(XRAY_LOCATION_ASSET="$geo" "$bin" run -test -c "$f" 2>&1)
              if ! grep -q "Configuration OK" <<<"$out"; then
                echo "::warning title=Xray $ver refuses $(basename "$f")::$(tail -n 1 <<<"$out")"
                bad=1
              fi
            done
            return $bad
          }

          CUR=$(xray_of "$AAR")
          echo "Committed core: $CUR"
          adopted=no
          if gh release download --repo 2dust/AndroidLibXrayLite --pattern libv2ray.aar --dir "$W" --clobber \
            || curl -fsSL -o "$W/libv2ray.aar" https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar; then
            NEW=$(xray_of "$W/libv2ray.aar")
            echo "Newest release: $NEW"
            if [ "$(key_of "$NEW")" -le "$(key_of "$CUR")" ]; then
              echo "The committed core is already the newest."
            elif ! api_ok "$W/libv2ray.aar"; then
              echo "::warning title=Xray core kept::$NEW changed the library interface; staying on $CUR"
            else
              configs_ok "$W/libv2ray.aar"; rc=$?
              if [ $rc = 0 ]; then
                cp "$W/libv2ray.aar" "$AAR"
                adopted=yes
                echo "::notice title=Xray core updated::$CUR -> $NEW"
              else
                echo "::warning title=Xray core kept::$NEW could not be verified with Volta's configs (code $rc); staying on $CUR"
              fi
            fi
          else
            echo "::warning title=Xray core kept::could not download the newest core; staying on $CUR"
          fi

          if [ $adopted = no ]; then
            configs_ok "$AAR"; rc=$?
            if [ $rc = 1 ]; then
              echo "::error title=Configs refused::the shipped core $CUR refuses configs Volta builds (see warnings)"
              exit 1
            elif [ $rc = 2 ]; then
              echo "::warning title=Configs not checked::could not build Xray $CUR to check the configs"
            fi
          fi
          echo "xray=$(xray_of "$AAR")" >> "$GITHUB_OUTPUT"
          echo "adopted=$adopted" >> "$GITHUB_OUTPUT"

      # OpenFlux: its core at the commit in openflux/VERSION plus Volta's small client
      # (openflux/voltaflux), built with the NDK as a program for each CPU type. It goes
      # in as lib/<abi>/libopenflux.so, where Android unpacks what an app may run.
      - name: OpenFlux helper
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=auto
          COMMIT=$(tr -d '[:space:]' < openflux/VERSION)
          SRC="$RUNNER_TEMP/openflux"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/p1neappleXpress/OpenFlux
          git -C "$SRC" fetch -q --depth 1 origin "$COMMIT"
          git -C "$SRC" checkout -q FETCH_HEAD
          mkdir -p "$SRC/mobile/cmd/voltaflux"
          cp openflux/voltaflux/main.go "$SRC/mobile/cmd/voltaflux/"
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          CC_DIR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in arm64-v8a:arm64:aarch64-linux-android26 \
                        armeabi-v7a:arm:armv7a-linux-androideabi26 \
                        x86_64:amd64:x86_64-linux-android26; do
            IFS=: read -r abi arch cc <<<"$target"
            mkdir -p "app/src/main/jniLibs/$abi"
            (cd "$SRC/mobile" && CGO_ENABLED=1 GOOS=android GOARCH="$arch" GOARM=7 CC="$CC_DIR/$cc-clang" \
              go build -trimpath -buildmode=pie -ldflags="-s -w -checklinkname=0" \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/libopenflux.so" ./cmd/voltaflux)
          done
          ls -la app/src/main/jniLibs/*/
          echo "openflux=$COMMIT" >> "$GITHUB_OUTPUT"
        id: openflux

      # AmneziaWG (1.0 to 3) and Hysteria v1, which the Xray core can't dial: Volta's own
      # helper (helper/voltaproxy, on amneziawg-go and sing-quic). Its tests raise real
      # AmneziaWG 3 and Hysteria servers on this runner and go through them; then it is
      # built with the NDK like OpenFlux, so the phone's own DNS resolver is used.
      - name: Voltaproxy helper
        id: voltaproxy
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=auto
          (cd helper/voltaproxy && go test -count=1 ./...)
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          CC_DIR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in arm64-v8a:arm64:aarch64-linux-android26 \
                        armeabi-v7a:arm:armv7a-linux-androideabi26 \
                        x86_64:amd64:x86_64-linux-android26; do
            IFS=: read -r abi arch cc <<<"$target"
            mkdir -p "app/src/main/jniLibs/$abi"
            (cd helper/voltaproxy && CGO_ENABLED=1 GOOS=android GOARCH="$arch" GOARM=7 CC="$CC_DIR/$cc-clang" \
              go build -trimpath -buildmode=pie -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/libvoltaproxy.so" .)
          done
          ls -la app/src/main/jniLibs/*/

      - name: APKs
        env:
          VOLTA_KEYSTORE_PASSWORD: ${{ secrets.VOLTA_KEYSTORE_PASSWORD }}
          VOLTA_KEY_ALIAS: ${{ secrets.VOLTA_KEY_ALIAS }}
          VOLTA_KEY_PASSWORD: ${{ secrets.VOLTA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          GRADLE_ARGS=(--no-configuration-cache --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8")
          ./gradlew "${GRADLE_ARGS[@]}" \
            :app:assembleGithubDebug :app:assembleGithubRelease 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          # The Play bundle in a run of its own: a bundle can't be built with ABI splits on,
          # and the GitHub APKs above need them (see splits in app/build.gradle.kts).
          ./gradlew "${GRADLE_ARGS[@]}" :app:bundlePlayRelease 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"

      # Compiler and Gradle errors as one annotation, readable without the raw log.
      - name: Report build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          ERRS=$(grep -E '^e: |error:|What went wrong|FAILED|Exception|> ' "$LOG" | grep -v '^\s*at ' | head -120)
          ERRS="${ERRS//'%'/'%25'}"
          ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Gradle build failed::${ERRS}"

      # Releases are not counted against the Actions artifact storage quota. A v… tag
      # becomes a published release (marked latest): installed apps find it through
      # releases/latest/download/update.json, with no key. Branches get one rolling
      # pre-release each, for testing; apps never update to those by themselves.
      - name: Publish to GitHub Releases
        id: release
        continue-on-error: true
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          XRAY: ${{ steps.core.outputs.xray }}
          OPENFLUX: ${{ steps.openflux.outputs.openflux }}
        run: |
          set -e
          TAG="$VOLTA_UPDATE_TAG"
          SHORT="${SHA::7}"
          VERSION="${VOLTA_VERSION_NAME:-1.1.$GITHUB_RUN_NUMBER}"
          STEM=$([ "$VOLTA_STABLE" = yes ] && echo "volta-$VERSION" || echo "volta-$SHORT")
          OUT="$RUNNER_TEMP/apk"
          mkdir -p "$OUT"
          # app-github-<abi>-release.apk → <stem>-<abi>.apk
          for f in app/build/outputs/apk/github/release/*.apk; do
            abi=$(basename "$f" .apk); abi=${abi#app-github-}; abi=${abi%-release}
            cp "$f" "$OUT/$STEM-$abi.apk"
          done
          cp app/build/outputs/apk/github/debug/*arm64-v8a*.apk "$OUT/$STEM-arm64-v8a-debug.apk"
          # What the in-app updater reads: this build's number and the APK for each CPU.
          APKS='[]'
          for f in "$OUT"/*.apk; do
            name=$(basename "$f"); abi=${name#$STEM-}; abi=${abi%.apk}
            APKS=$(jq -c --arg abi "$abi" --arg name "$name" --argjson size "$(stat -c %s "$f")" \
              --arg sha "$(sha256sum "$f" | cut -d ' ' -f 1)" \
              '. + [{abi: $abi, name: $name, size: $size, sha256: $sha}]' <<<"$APKS")
          done
          jq -n --argjson code "$((100 + GITHUB_RUN_NUMBER))" --arg name "$VERSION" --arg tag "$TAG" \
            --arg commit "$SHA" --arg branch "$BRANCH" --arg xray "${XRAY:-}" --argjson apks "$APKS" \
            '{versionCode: $code, versionName: $name, tag: $tag, commit: $commit, branch: $branch, xray: $xray, apks: $apks}' \
            > "$OUT/update.json"
          # The Google Play bundle rides along; it is uploaded to the Play Console by hand.
          cp app/build/outputs/bundle/playRelease/*.aab "$OUT/$STEM-google-play.aab" 2>/dev/null || true
          ls -la "$OUT"
          cat "$OUT/update.json"

          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<EOF_NOTES
          Volta $VERSION.

          - **\`$STEM-arm64-v8a.apk\`** — для почти всех телефонов, ставьте этот.
          - \`$STEM-armeabi-v7a.apk\` — для старых 32-битных телефонов.
          - \`$STEM-universal.apk\` — подходит всем, но весит больше.
          - \`$STEM-x86_64.apk\` — для эмулятора.
          - \`$STEM-google-play.aab\` — пакет для загрузки в Google Play Console.

          Уже установленное приложение найдёт эту версию само: Настройки → О приложении.
          Инструкции: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/

          Сборка из коммита $SHA. Ядро: \`${XRAY:-—}\`. OpenFlux: \`${OPENFLUX:-—}\` (GPL-3.0).
          EOF_NOTES

          if [ "$VOLTA_STABLE" = yes ]; then
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release upload "$TAG" "$OUT"/* --clobber
              gh release edit "$TAG" --latest --prerelease=false --notes-file "$NOTES"
            else
              gh release create "$TAG" "$OUT"/* --verify-tag --latest \
                --title "Volta $VERSION" --notes-file "$NOTES"
            fi
          else
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
            gh release create "$TAG" "$OUT"/* --target "$SHA" --prerelease \
              --title "Volta $VERSION · $BRANCH · $SHORT (тестовая)" --notes-file "$NOTES"
          fi
          echo "url=https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
          echo "### APK: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # Pictures of the home screen and frames of the power disc's animation, drawn from
      # the real composables under Robolectric (app/src/test/.../ui/shots), so a design
      # change can be looked at before anyone installs it. Goes to the branch's
      # pre-release as screens.zip; never fails the build.
      - name: Screenshots
        if: github.event_name == 'pull_request' && steps.release.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e -o pipefail
          export VOLTA_SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$VOLTA_SHOTS"
          ./gradlew --no-configuration-cache --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            :app:testGithubDebugUnitTest --tests 'com.ars3nb.volta.ui.shots.*' 2>&1 | tee "$RUNNER_TEMP/shots.log" | tail -60
          status=$?
          cp "$RUNNER_TEMP/shots.log" "$VOLTA_SHOTS/gradle.log"
          cp -r app/build/test-results/testGithubDebugUnitTest "$VOLTA_SHOTS/results" 2>/dev/null || true
          (cd "$VOLTA_SHOTS" && zip -qr "$RUNNER_TEMP/screens.zip" .)
          ls -la "$RUNNER_TEMP/screens.zip"
          gh release upload "$VOLTA_UPDATE_TAG" "$RUNNER_TEMP/screens.zip" --clobber
          exit $status

      # Fallback when the release could not be made (e.g. a fork PR without write access).
      - name: Upload APKs as an artifact
        if: steps.release.outcome != 'success'
        uses: actions/upload-artifact@v5
        with:
          name: volta-apk
          path: app/build/outputs/apk/github/release/*arm64-v8a*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # The main screens drawn under Robolectric in English and German, with the text each
  # one shows (ui/shots/LocalizedScreensTest): run by hand with "shots" ticked, to see
  # that no Russian is left when another language is chosen. Pictures as an artifact.
  shots:
    if: ${{ inputs.shots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK; install it ourselves only if missing.
      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;36.0.0" > /dev/null
          "$SDKM" "platforms;android-37" > /dev/null || "$SDKM" "platforms;android-37.0" > /dev/null || true
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v5

      # The pictures go to the branch's "shots-…" pre-release as l10n-screens.zip (and an
      # artifact); each test's failure and the text of every screen go to the log.
      - name: Screens
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e -o pipefail
          export VOLTA_SHOTS="$RUNNER_TEMP/shots"
          mkdir -p "$VOLTA_SHOTS"
          chmod +x gradlew
          ./gradlew --no-configuration-cache --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            :app:testGithubDebugUnitTest --tests 'com.ars3nb.volta.ui.shots.LocalizedScreens*' > "$VOLTA_SHOTS/gradle.log" 2>&1
          status=$?
          grep -E '^e: |What went wrong|FAILED|tests completed|BUILD' -A2 "$VOLTA_SHOTS/gradle.log" | head -120
          RESULTS=app/build/test-results/testGithubDebugUnitTest
          echo "::group::Failures"
          grep -h -A25 '<failure' "$RESULTS"/*.xml 2>/dev/null | grep -vE '^\s+at (org\.junit|org\.robolectric|java\.|jdk\.|kotlin\.|androidx\.test)' | head -400
          echo "::endgroup::"
          for f in "$VOLTA_SHOTS"/l10n/*/*.txt; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"
          done
          cp -r "$RESULTS" "$VOLTA_SHOTS/results" 2>/dev/null
          (cd "$VOLTA_SHOTS" && zip -qr "$RUNNER_TEMP/l10n-screens.zip" .)
          TAG="shots-${BRANCH//\//-}"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Screens · $BRANCH" --notes "The main screens in English and German (LocalizedScreensTest)."
          gh release upload "$TAG" "$RUNNER_TEMP/l10n-screens.zip" --clobber
          exit $status

      - name: Upload the screens
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: screens
          path: ${{ runner.temp }}/l10n-screens.zip
          retention-days: 7
          if-no-files-found: warn
